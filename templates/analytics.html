<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Analytics Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --accent: #f59e0b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard-container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            padding: 2.5rem;
            border-radius: 24px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-back {
            background: #334155;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn-back:hover {
            background: #475569;
        }

        /* 📊 Table Styling Rules */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            margin-top: 1rem;
        }

        th {
            padding: 14px;
            color: #a5b4fc;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 2px solid var(--card-border);
        }

        td {
            padding: 16px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.95rem;
            word-break: break-all;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .clicks-badge {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 3rem 0;
            font-size: 1.1rem;
        }
    </style>
</head>

<body>

    <div class="dashboard-container">
        <div class="header-box">
            <h1><i class="fa-solid fa-chart-simple"></i> Link Analytics</h1>
            <a href="/" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Shorten More</a>
        </div>

        {% if links %}
        <table>
            <thead>
                <tr>
                    <th>Short Code</th>
                    <th>Original Destination URL</th>
                    <th>Total Clicks</th>
                </tr>
            </thead>
            <tbody>
                {% for link in links %}
                <tr>
                    <td><strong style="color: #f8fafc;">{{ link[0] }}</strong></td>
                    <td><span style="color: var(--text-muted);">{{ link[1] }}</span></td>
                    <td><span class="clicks-badge">{{ link[2] }} clicks</span></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <div class="empty-state">
            <i class="fa-regular fa-folder-open" style="font-size: 2.5rem; margin-bottom: 1rem; display: block;"></i>
            No links shortened yet. Go create some links first!
        </div>
        {% endif %}
    </div>

</body>

</html>
